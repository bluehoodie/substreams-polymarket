syntax = "proto3";

package polymarket.exchange.v1;

message TransactionContext {
  string tx_hash = 1;
  uint64 log_index = 2;
  uint64 block_number = 3;
  uint64 timestamp = 4;
}

// V2 OrderFilled - side replaces maker/taker asset IDs
message OrderFilled {
  bytes order_hash = 1;
  string maker = 2;
  string taker = 3;
  uint32 side = 4;
  string token_id = 5;
  string maker_amount_filled = 6;
  string taker_amount_filled = 7;
  string fee = 8;
  TransactionContext tx = 9;
  bytes builder = 10;
  bytes metadata = 11;
}

// V2 OrdersMatched - side + token_id replace dual asset IDs
message OrdersMatched {
  bytes taker_order_hash = 1;
  string taker_order_maker = 2;
  uint32 side = 3;
  string token_id = 4;
  string maker_amount_filled = 5;
  string taker_amount_filled = 6;
  TransactionContext tx = 7;
}

message OrderPreapproved {
  bytes order_hash = 1;
  TransactionContext tx = 2;
}

message OrderPreapprovalInvalidated {
  bytes order_hash = 1;
  TransactionContext tx = 2;
}

message FeeCharged {
  string recipient = 1;
  string amount = 2;
  TransactionContext tx = 3;
}

message FeeReceiverUpdated {
  string fee_receiver = 1;
  TransactionContext tx = 2;
}

message MaxFeeRateUpdated {
  string max_fee_rate = 1;
  TransactionContext tx = 2;
}

message NewAdmin {
  string new_admin_address = 1;
  string admin = 2;
  TransactionContext tx = 3;
}

message NewOperator {
  string new_operator_address = 1;
  string admin = 2;
  TransactionContext tx = 3;
}

message RemovedAdmin {
  string removed_admin = 1;
  string admin = 2;
  TransactionContext tx = 3;
}

message RemovedOperator {
  string removed_operator = 1;
  string admin = 2;
  TransactionContext tx = 3;
}

message UserPaused {
  string user = 1;
  string effective_pause_block = 2;
  TransactionContext tx = 3;
}

message UserUnpaused {
  string user = 1;
  TransactionContext tx = 2;
}

message UserPauseBlockIntervalUpdated {
  string old_interval = 1;
  string new_interval = 2;
  TransactionContext tx = 3;
}

// Container messages
message ExchangeEvents {
  repeated OrderFilled order_filled = 1;
  repeated OrdersMatched orders_matched = 2;
}

message FeeEvents {
  repeated FeeCharged fee_charged = 1;
  repeated FeeReceiverUpdated fee_receiver_updated = 2;
  repeated MaxFeeRateUpdated max_fee_rate_updated = 3;
}

message AdminEvents {
  repeated NewAdmin new_admin = 1;
  repeated NewOperator new_operator = 2;
  repeated RemovedAdmin removed_admin = 3;
  repeated RemovedOperator removed_operator = 4;
}

message PauseEvents {
  repeated UserPaused user_paused = 1;
  repeated UserUnpaused user_unpaused = 2;
  repeated UserPauseBlockIntervalUpdated user_pause_block_interval_updated = 3;
}

message OrderApprovalEvents {
  repeated OrderPreapproved order_preapproved = 1;
  repeated OrderPreapprovalInvalidated order_preapproval_invalidated = 2;
}

message AllEvents {
  optional ExchangeEvents exchange_events = 1;
  optional FeeEvents fee_events = 2;
  optional AdminEvents admin_events = 3;
  optional PauseEvents pause_events = 4;
  optional OrderApprovalEvents order_approval_events = 5;
}
