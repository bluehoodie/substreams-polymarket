specVersion: v0.1.0
package:
  name: polymarket-exchange
  version: v0.8.0
  url: https://github.com/bluehoodie/substreams-polymarket
  image: ./polymarket.png

network: polygon

imports:
  ethereum: https://github.com/streamingfast/substreams-ethereum/releases/download/v0.11.1/substreams-ethereum-v0.11.1.spkg

protobuf:
  files:
    - polymarket/exchange/v1/events.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket_exchange.wasm

modules:
  - name: index_events
    kind: blockIndex
    initialBlock: 84934480
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:sf.substreams.index.v1.Keys
    doc: |
      Emits `evt_addr:<address>` for every block containing a CTF Exchange log,
      letting downstream modules skip blocks that never touch the contract.

  - name: map_exchange_events
    kind: map
    initialBlock: 84934480
    blockFilter:
      module: index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.ExchangeEvents

  - name: map_fee_events
    kind: map
    initialBlock: 84934480
    blockFilter:
      module: index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.FeeEvents

  - name: map_admin_events
    kind: map
    initialBlock: 84934480
    blockFilter:
      module: index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.AdminEvents

  - name: map_pause_events
    kind: map
    initialBlock: 84934480
    blockFilter:
      module: index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.PauseEvents

  - name: map_approval_events
    kind: map
    initialBlock: 84934480
    blockFilter:
      module: index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.OrderApprovalEvents

  - name: map_all_events
    kind: map
    initialBlock: 84934480
    blockFilter:
      module: index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.AllEvents

  # Track all trades by specific user(s). The blockFilter skips blocks none of the
  # watched traders appear in; the handler keeps only their trades within the rest.
  # Set the watched traders at runtime, e.g.:
  #   -p map_user_trades="trader:0x<addr> || trader:0x<addr>"
  - name: map_user_trades
    kind: map
    initialBlock: 84934480
    blockFilter:
      module: index_events
      query:
        params: true
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.ExchangeEvents

params:
  # Default watched trader (the zero address — matches no real wallet). Override at
  # run time with -p map_user_trades="trader:0x<addr> || trader:0x<addr>".
  map_user_trades: "trader:0x0000000000000000000000000000000000000000"
