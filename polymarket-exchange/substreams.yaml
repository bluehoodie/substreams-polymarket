specVersion: v0.1.0
package:
  name: polymarket-exchange
  version: v1.0.0
  url: https://github.com/bluehoodie/substreams-polymarket
  description: Polymarket CTF Exchange V2 events — order fills, fees, admin, pause, and order approvals
  image: ./polymarket.png

network: polygon

imports:
  eth_common: https://spkg.io/v1/packages/ethereum-common/v0.3.3

protobuf:
  files:
    - polymarket/exchange/v1/events.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket_exchange.wasm

modules:
  - name: map_exchange_events
    kind: map
    initialBlock: 84902353
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.ExchangeEvents
    doc: |
      Extracts exchange trading events (OrderFilled, OrdersMatched) from the
      CTF Exchange V2 contract.

  - name: map_fee_events
    kind: map
    initialBlock: 84902353
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.FeeEvents
    doc: |
      Extracts fee-related events (FeeCharged, FeeReceiverUpdated,
      MaxFeeRateUpdated) from the CTF Exchange V2 contract.

  - name: map_admin_events
    kind: map
    initialBlock: 84902353
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.AdminEvents
    doc: |
      Extracts admin role events (NewAdmin, NewOperator, RemovedAdmin,
      RemovedOperator) from the CTF Exchange V2 contract.

  - name: map_pause_events
    kind: map
    initialBlock: 84902353
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.PauseEvents
    doc: |
      Extracts user pause events (UserPaused, UserUnpaused,
      UserPauseBlockIntervalUpdated) from the CTF Exchange V2 contract.

  - name: map_approval_events
    kind: map
    initialBlock: 84902353
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.OrderApprovalEvents
    doc: |
      Extracts order approval events (OrderPreapproved,
      OrderPreapprovalInvalidated) from the CTF Exchange V2 contract.

  - name: map_all_events
    kind: map
    initialBlock: 84902353
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.exchange.v1.AllEvents
    doc: |
      Extracts all exchange events (trading, fees, admin, pause, approvals)
      from a single pass over the CTF Exchange V2 contract.
