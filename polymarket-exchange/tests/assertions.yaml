# `substreams run --test-file` assertions on blocks 96600000 (CTF Exchange V2 only) and
# 96680009 (CTF Exchange V2 and ExchangeV3), the same blocks as the Rust fixtures
# testdata/polygon_<block>.binpb.b64. Run: scripts/run_test_files.sh.
# Paths must yield a string (hence `| tostring`): the CLI runner skips other results.
tests:
  - module: map_all_events
    block: 96600000
    path: '.exchangeEvents.orderFilled | length | tostring'
    expect: "36"
  - module: map_all_events
    block: 96600000
    path: '.exchangeEvents.ordersMatched | length | tostring'
    expect: "9"
  - module: map_all_events
    block: 96600000
    path: '.feeEvents.feeCharged | length | tostring'
    expect: "9"
  - module: map_all_events
    block: 96600000
    path: '.exchangeEvents.orderFilled[0].maker'
    expect: "0x45f82472a88f759f8a98174d3cdd3db4a9ee6d79"
  - module: map_all_events
    block: 96680009
    path: '[.exchangeEvents.orderFilled[] | select(.exchange == "exchange_v3")] | length | tostring'
    expect: "4"
  - module: map_all_events
    block: 96680009
    path: '[.exchangeEvents.orderFilled[] | select(.exchange == "ctf_v2")] | length | tostring'
    expect: "29"
  - module: map_all_events
    block: 96680009
    path: '[.exchangeEvents.ordersMatched[] | select(.exchange == "exchange_v3")] | length | tostring'
    expect: "2"
  - module: map_all_events
    block: 96680009
    path: '[.feeEvents.feeCharged[] | select(.exchange == "exchange_v3")] | length | tostring'
    expect: "2"
