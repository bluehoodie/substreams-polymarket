# `substreams run --test-file` assertions on block 96600000, the same block as the
# Rust fixture testdata/polygon_96600000.binpb.b64. Run: scripts/run_test_files.sh.
# Paths must yield a string (hence `| tostring`): the CLI runner skips other results.
tests:
  - module: map_all_events
    block: 96600000
    path: '.pusdEvents.transfer | length | tostring'
    expect: "87"
  - module: map_all_events
    block: 96600000
    path: '.pusdEvents.wrapped | length | tostring'
    expect: "3"
  - module: map_all_events
    block: 96600000
    path: '.pusdEvents.unwrapped | length | tostring'
    expect: "10"
  - module: map_all_events
    block: 96600000
    path: '.ctfAdapterEvents.positionsRedeemed | length | tostring'
    expect: "2"
  - module: map_all_events
    block: 96600000
    path: '.negRiskCtfAdapterEvents.positionsRedeemed | length | tostring'
    expect: "1"
  - module: map_all_events
    block: 96600000
    path: '.pusdEvents.transfer[0].amount'
    expect: "342926010"
