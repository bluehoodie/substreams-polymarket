specVersion: v0.1.0
package:
  name: polymarket-collateral
  version: v0.8.0
  url: https://github.com/bluehoodie/substreams-polymarket
  image: ./polymarket.png

network: polygon

imports:
  ethereum: https://github.com/streamingfast/substreams-ethereum/releases/download/v0.11.1/substreams-ethereum-v0.11.1.spkg

protobuf:
  files:
    - polymarket/collateral/v1/events.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket_collateral.wasm

modules:
  - name: index_events
    kind: blockIndex
    initialBlock: 85049190
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:sf.substreams.index.v1.Keys
    doc: |
      Emits `evt_addr:<address>` for every block containing a log from any of this
      package's collateral contracts (pUSD, CTF collateral adapter, neg-risk CTF
      collateral adapter). Each consumer filters on the address(es) it needs.

  - name: map_pusd_events
    kind: map
    initialBlock: 85049190
    blockFilter:
      module: index_events
      query:
        string: "evt_addr:0xc011a7e12a19f7b1f670d46f03b03f3342e82dfb"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.collateral.v1.PusdEvents

  - name: map_ctf_adapter_events
    kind: map
    initialBlock: 85049190
    blockFilter:
      module: index_events
      query:
        string: "evt_addr:0xada100db00ca00073811820692005400218fce1f"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.collateral.v1.CtfAdapterEvents

  - name: map_neg_risk_ctf_adapter_events
    kind: map
    initialBlock: 85049190
    blockFilter:
      module: index_events
      query:
        string: "evt_addr:0xada2005600dec949baf300f4c6120000bdb6eaab"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.collateral.v1.NegRiskCtfAdapterEvents

  - name: map_all_events
    kind: map
    initialBlock: 85049190
    blockFilter:
      module: index_events
      query:
        string: >-
          evt_addr:0xc011a7e12a19f7b1f670d46f03b03f3342e82dfb ||
          evt_addr:0xada100db00ca00073811820692005400218fce1f ||
          evt_addr:0xada2005600dec949baf300f4c6120000bdb6eaab
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.collateral.v1.AllEvents
