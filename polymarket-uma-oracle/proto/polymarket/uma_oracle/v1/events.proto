syntax = "proto3";

package polymarket.uma_oracle.v1;

message TransactionContext {
  string tx_hash = 1;
  uint64 log_index = 2;
  uint64 block_number = 3;
  uint64 timestamp = 4;
}

// --- OptimisticOracleV2 events (primary — 222k+ txns) ---

// ProposePrice - emitted when someone proposes a resolution on V2
message ProposePrice {
  string requester = 1;
  string proposer = 2;
  bytes identifier = 3;
  string timestamp = 4;
  bytes ancillary_data = 5;
  string proposed_price = 6;
  string expiration_timestamp = 7;
  string currency = 8;
  TransactionContext tx = 9;
}

// DisputePrice - emitted when someone disputes a proposed price on V2
message DisputePrice {
  string requester = 1;
  string proposer = 2;
  string disputer = 3;
  bytes identifier = 4;
  string timestamp = 5;
  bytes ancillary_data = 6;
  string proposed_price = 7;
  TransactionContext tx = 8;
}

// Settle - emitted when a V2 request reaches final settlement
message SettleV2 {
  string requester = 1;
  string proposer = 2;
  string disputer = 3;
  bytes identifier = 4;
  string timestamp = 5;
  bytes ancillary_data = 6;
  string price = 7;
  string payout = 8;
  TransactionContext tx = 9;
}

message OracleV2Events {
  repeated ProposePrice propose_price = 1;
  repeated DisputePrice dispute_price = 2;
  repeated SettleV2 settle = 3;
}

// --- OptimisticOracleV3 events (secondary — 47 txns) ---

// AssertionMade - emitted when a resolution is proposed to the V3 oracle
message AssertionMade {
  bytes assertion_id = 1;
  bytes domain_id = 2;
  bytes claim = 3;
  string asserter = 4;
  string callback_recipient = 5;
  string escalation_manager = 6;
  string caller = 7;
  uint64 expiration_time = 8;
  string currency = 9;
  string bond = 10;
  bytes identifier = 11;
  TransactionContext tx = 12;
}

// AssertionDisputed - emitted when someone disputes a pending V3 assertion
message AssertionDisputed {
  bytes assertion_id = 1;
  string caller = 2;
  string disputer = 3;
  TransactionContext tx = 4;
}

// AssertionSettled - emitted when a V3 assertion reaches final settlement
message AssertionSettled {
  bytes assertion_id = 1;
  string bond_recipient = 2;
  bool disputed = 3;
  bool settlement_resolution = 4;
  string settle_caller = 5;
  TransactionContext tx = 6;
}

message OracleV3Events {
  repeated AssertionMade assertion_made = 1;
  repeated AssertionDisputed assertion_disputed = 2;
  repeated AssertionSettled assertion_settled = 3;
}

// --- Unified dispute alerts (from both V2 and V3) ---

message DisputeAlert {
  string source = 1;
  string requester = 2;
  string disputer = 3;
  bytes identifier = 4;
  bytes ancillary_data = 5;
  TransactionContext tx = 6;
}

message DisputeAlerts {
  repeated DisputeAlert alerts = 1;
}

// AllEvents wraps all event types
message AllEvents {
  optional OracleV2Events v2_events = 1;
  optional OracleV3Events v3_events = 2;
  optional DisputeAlerts dispute_alerts = 3;
}
