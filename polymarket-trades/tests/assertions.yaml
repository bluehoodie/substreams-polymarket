# `substreams run --test-file` assertions on blocks 96600000 (CTF V2 + Neg Risk) and
# 96680009 (also ExchangeV3), the same blocks as the Rust fixture tests. Run:
# scripts/run_test_files.sh trades. Paths must yield a string (hence `| tostring`).
tests:
  - module: map_trades
    block: 96600000
    path: '.trades | length | tostring'
    expect: "50"
  - module: map_trades
    block: 96600000
    path: '[.trades[] | select(.isMatch)] | length | tostring'
    expect: "15"
  - module: map_trades
    block: 96600000
    path: '.trades[0].price'
    expect: "0.400000"
  - module: map_trades
    block: 96680009
    path: '[.trades[] | select(.exchange == "exchange_v3")] | length | tostring'
    expect: "4"
  - module: map_trades
    block: 96680009
    path: '[.trades[] | select(.exchange == "exchange_v3" and .isMatch)][0].collateral'
    expect: "1000000"
