specVersion: v0.1.0
package:
  name: polymarket-trades
  version: v1.1.0
  url: https://github.com/bluehoodie/substreams-polymarket
  description: Polymarket trade tape — every order fill from CTF Exchange V2, Neg Risk CTF Exchange V2 and ExchangeV3, with fee-aware price
  image: ./polymarket.png

network: polygon

# The sibling manifests, not their published spkgs: built from the same code at the
# same (lockstep) version, their modules hash the same as the published packages',
# so their cached outputs are reused instead of re-decoding blocks.
imports:
  exchange: ../polymarket-exchange/substreams.yaml
  neg_risk_ctf: ../polymarket-neg-risk-ctf/substreams.yaml

protobuf:
  files:
    - polymarket/trades/v1/trades.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket_trades.wasm

modules:
  - name: map_trades
    kind: map
    initialBlock: 84902353
    inputs:
      - map: exchange:map_exchange_events
      - map: neg_risk_ctf:map_trading_events
    output:
      type: proto:polymarket.trades.v1.Trades
    doc: |
      One trade per OrderFilled across CTF Exchange V2, Neg Risk CTF Exchange V2
      and ExchangeV3, in block order: token, side, shares, fee-aware collateral and
      price, maker, taker, order hash, exchange, and is_match (the taker order's
      own fill, one per match).

  - name: store_token_totals
    kind: store
    initialBlock: 84902353
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_trades
    doc: |
      Running totals per outcome token, keyed `<token_id>:<field>`: trades, buys,
      sells, volume_collateral and volume_shares over is_volume trades (each match
      once per token), and fees over every fill.

  - name: store_last_price
    kind: store
    initialBlock: 84902353
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_trades
    doc: |
      Price of the latest is_volume trade per token, keyed by token id.

  - name: map_market_stats
    kind: map
    initialBlock: 84902353
    inputs:
      - map: map_trades
      - store: store_token_totals
      - store: store_last_price
    output:
      type: proto:polymarket.trades.v1.MarketStats
    doc: |
      For every token traded in the block: cumulative trades, buys, sells, volume
      and fees, last price, and the block's VWAP and volume.

  - name: map_candles
    kind: map
    initialBlock: 84902353
    inputs:
      - map: map_trades
    output:
      type: proto:polymarket.trades.v1.Candles
    doc: |
      1-minute OHLCV fragment per token from this block's is_volume trades. No
      store: a sink merges fragments of the same (token_id, bucket_start) — open
      from the lowest (block_number, open_log_index), close from the highest,
      high max, low min, volumes and trades summed.

  - name: store_order_filled
    kind: store
    initialBlock: 84902353
    updatePolicy: add
    valueType: bigint
    inputs:
      - map: map_trades
    doc: |
      Cumulative fill progress per signed order, keyed `<order_hash>:<field>`:
      shares, collateral, fees and fills. One key set per order ever filled.

  - name: store_order_first_seen
    kind: store
    initialBlock: 84902353
    updatePolicy: set_if_not_exists
    valueType: int64
    inputs:
      - map: map_trades
    doc: |
      Block of each order's first fill, keyed by order hash.

  - name: map_order_fills
    kind: map
    initialBlock: 84902353
    inputs:
      - map: map_trades
      - store: store_order_filled
      - store: store_order_first_seen
    output:
      type: proto:polymarket.trades.v1.OrderFills
    doc: |
      For every order filled in the block: owner, token, side, exchange, cumulative
      filled shares, collateral and fees, fill count, and first and last fill block.
