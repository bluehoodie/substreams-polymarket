[package]
name = "polymarket-substreams-common"
version = "0.1.0"
edition = "2021"

[dependencies]
substreams = "0.8.0"
substreams-ethereum = "0.12.0"
hex = "0.4"
hex-literal = "0.4"
num-bigint = "0.4"
sha3 = { version = "0.10", default-features = false }
buffa = { version = "0.9.2", default-features = false, features = ["std", "fast-utf8"] }
# Only for the `fixtures` feature (test-only real-block fixture loader).
base64 = { version = "0.22", optional = true }

[features]
# Enables `load_block_b64` for tests. Packages turn it on from [dev-dependencies]
# only, so it never reaches the wasm build.
fixtures = ["dep:base64"]

[build-dependencies]
anyhow = "1.0"
substreams-ethereum = "0.12.0"

[dev-dependencies]
criterion = { version = "0.5", default-features = false }
buffa-types = { version = "0.9.2", default-features = false }

[[bench]]
name = "lazy_vs_owned"
harness = false
