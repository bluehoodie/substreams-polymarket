# `substreams run --test-file` assertions on blocks 96591795 (UMA) and 96681462
# (Protocol V2 modules), the same blocks as the Rust fixtures
# testdata/polygon_<block>.binpb.b64. Run: scripts/run_test_files.sh.
# Paths must yield a string (hence `| tostring`): the CLI runner skips other results.
tests:
  - module: map_resolution_events
    block: 96591795
    path: '.oracle.settlements | length | tostring'
    expect: "1"
  - module: map_resolution_events
    block: 96591795
    path: '.adapter.questionResolved | length | tostring'
    expect: "1"
  - module: map_resolution_events
    block: 96591795
    path: '.oracle.settlements[0].payout'
    expect: "755000000"
  - module: map_resolution_events
    block: 96681462
    path: '[.modules.conditionResolved[] | select(.module == "binary")] | length | tostring'
    expect: "30"
  - module: map_resolution_events
    block: 96681462
    path: '[.modules.conditionResolved[] | select(.module == "neg_risk")] | length | tostring'
    expect: "11"
  - module: map_resolution_events
    block: 96681462
    path: '.modules.conditionResolved[0].payouts | join(",")'
    expect: "0,1000000"
