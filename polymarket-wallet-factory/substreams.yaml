specVersion: v0.1.0
package:
  name: polymarket-wallet-factory
  version: v0.12.0
  url: https://github.com/bluehoodie/substreams-polymarket
  description: Polymarket DepositWalletFactory events — proxy deposit-wallet deployments
  image: ./polymarket.png

network: polygon

imports:
  eth_common: https://spkg.io/v1/packages/ethereum-common/v0.3.3

protobuf:
  files:
    - polymarket/wallet_factory/v1/events.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket_wallet_factory.wasm

modules:
  - name: map_factory_events
    kind: map
    initialBlock: 84902000
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0x00000000000fb5c9adea0298d729a0cb3823cc07"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.wallet_factory.v1.FactoryEvents
