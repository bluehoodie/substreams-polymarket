# `substreams run --test-file` assertions on block 96600000, the same block as the
# Rust fixture testdata/polygon_96600000.binpb.b64. Run: scripts/run_test_files.sh.
# Paths must yield a string (hence `| tostring`): the CLI runner skips other results.
tests:
  - module: map_factory_events
    block: 96600000
    path: '.walletDeployed | length | tostring'
    expect: "1"
  - module: map_factory_events
    block: 96600000
    path: '.walletDeployed[0].wallet'
    expect: "0xa4639e6625d03cc907da0865b11ab261fd933edd"
