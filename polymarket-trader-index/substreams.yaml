specVersion: v0.1.0
package:
  name: polymarket-trader-index
  version: v1.0.0
  url: https://github.com/bluehoodie/substreams-polymarket
  description: >-
    Foundational block index of Polymarket user activity. Emits a `user:<address>`
    key for every wallet that took ANY action in a block (trades, position
    splits/merges, redemptions, conversions, pUSD transfers, ERC1155 transfers,
    wallet deployments) across all Polymarket contracts. Downstream packages
    import this and add a `blockFilter` querying `user:0x…` to skip every block a
    wallet never touched.
  image: ./polymarket.png

network: polygon

imports:
  eth_common: https://spkg.io/v1/packages/ethereum-common/v0.3.3
  # The warm v1.0.0 index. `map_user_keys` and `index_users` below are taken
  # from it with `use:` so their module hashes stay those of v1.0.0 and the
  # already-built `index_users` index keeps serving `map_user_activity`. Any
  # change to this crate re-hashes them otherwise, forcing a re-warm from
  # block 4023686 during which `map_user_activity` returns nothing.
  # Re-point these at this package's own code only in a release that accepts
  # that re-warm.
  warm: https://spkg.io/v1/packages/polymarket-trader-index/v1.0.0

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket_trader_index.wasm

modules:
  - name: map_user_keys
    use: warm:map_user_keys
    doc: |
      Warming gate, taken unchanged from v1.0.0 (see the `warm` import). Reuses
      the already-warm foundational `eth_common:index_events` to run only on
      blocks where one of the 8 Polymarket contracts emitted an event, then
      emits a `user:<address>` key for every wallet involved.

  - name: index_users
    use: warm:index_users
    doc: |
      Per block, emits `user:<address>` for every wallet involved in any
      Polymarket action that block, taken unchanged from v1.0.0 (see the `warm`
      import) so the warm index is reused. Consumers filter with e.g.
      query.string: "user:0xabc… || user:0xdef…" to process only the blocks those
      wallets were active in.

  - name: map_user_activity
    kind: map
    initialBlock: 4023686
    blockFilter:
      module: index_users
      query:
        params: true
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:sf.substreams.index.v1.Keys

params:
  map_user_activity: "user:0x0000000000000000000000000000000000000000"
