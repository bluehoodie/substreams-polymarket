specVersion: v0.1.0
package:
  name: polymarket-trader-index
  version: v0.10.0
  url: https://github.com/bluehoodie/substreams-polymarket
  description: >-
    Foundational block index of Polymarket user activity. Emits a `user:<address>`
    key for every wallet that took ANY action in a block (trades, position
    splits/merges, redemptions, conversions, pUSD transfers, ERC1155 transfers,
    wallet deployments) across all Polymarket contracts. Downstream packages
    import this and add a `blockFilter` querying `user:0x…` to skip every block a
    wallet never touched.
  image: ./polymarket.png

network: polygon

imports:
  ethereum: https://github.com/streamingfast/substreams-ethereum/releases/download/v0.11.1/substreams-ethereum-v0.11.1.spkg
  eth_common: ethereum_common@v0.3.3

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket_trader_index.wasm

modules:
  - name: map_user_keys
    kind: map
    initialBlock: 4023686
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xe111180000d2663c0091e4f400237545b87b996b || evt_addr:0xe2222d279d744050d28e00520010520000310f59 || evt_addr:0x4d97dcd97ec945f40cf65f87097ace5ea0476045 || evt_addr:0xd91e80cf2e7be2e162c6513ced06f1dd0da35296 || evt_addr:0xc011a7e12a19f7b1f670d46f03b03f3342e82dfb || evt_addr:0xada100db00ca00073811820692005400218fce1f || evt_addr:0xada2005600dec949baf300f4c6120000bdb6eaab || evt_addr:0x00000000000fb5c9adea0298d729a0cb3823cc07"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:sf.substreams.index.v1.Keys
    doc: |
      Warming gate. Reuses the already-warm foundational `eth_common:index_events`
      to run only on blocks where one of the 8 Polymarket contracts emitted an
      event, then decodes those logs and emits a `user:<address>` key for every
      wallet involved. Segments with no Polymarket activity are skipped wholesale,
      so warming this package only touches blocks with Polymarket activity.

  - name: index_users
    kind: blockIndex
    initialBlock: 4023686
    inputs:
      - map: map_user_keys
    output:
      type: proto:sf.substreams.index.v1.Keys
    doc: |
      Per block, emits `user:<address>` for every wallet involved in any Polymarket
      action that block. Consumers filter with e.g.
      query.string: "user:0xabc… || user:0xdef…" to process only the blocks those
      wallets were active in. Pass-through of `map_user_keys`: inherits its
      foundational-index skipping (when the map is skipped its output is absent, so
      this index has no input and is skipped too).

  - name: map_user_activity
    kind: map
    initialBlock: 4023686
    blockFilter:
      module: index_users
      query:
        params: true
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:sf.substreams.index.v1.Keys

params:
  map_user_activity: "user:0x0000000000000000000000000000000000000000"
