specVersion: v0.1.0
package:
  name: polymarket-neg-risk-adapter
  version: v0.2.1
  url: https://github.com/bluehoodie/substreams-polymarket
  image: ./polymarket.png

network: polygon

imports:
  ethereum: https://github.com/streamingfast/substreams-ethereum/releases/download/v0.11.1/substreams-ethereum-v0.11.1.spkg

protobuf:
  files:
    - polymarket/neg_risk_adapter/v1/events.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket_neg_risk_adapter.wasm

modules:
  - name: map_market_events
    kind: map
    initialBlock: 50505403
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.neg_risk_adapter.v1.MarketEvents

  - name: map_trading_events
    kind: map
    initialBlock: 50505403
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.neg_risk_adapter.v1.TradingEvents

  - name: map_admin_events
    kind: map
    initialBlock: 50505403
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.neg_risk_adapter.v1.AdminEvents

  - name: map_all_events
    kind: map
    initialBlock: 50505403
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.neg_risk_adapter.v1.AllEvents
