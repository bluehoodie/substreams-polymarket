specVersion: v0.1.0
package:
  name: polymarket-neg-risk-adapter
  version: v1.0.0
  url: https://github.com/bluehoodie/substreams-polymarket
  description: Polymarket NegRiskAdapter events — market preparation, trading (convert/split/merge/redeem), and admin actions
  image: ./polymarket.png

network: polygon

imports:
  eth_common: https://spkg.io/v1/packages/ethereum-common/v0.3.3

protobuf:
  files:
    - polymarket/neg_risk_adapter/v1/events.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ../target/wasm32-unknown-unknown/release/polymarket_neg_risk_adapter.wasm

modules:
  - name: map_market_events
    kind: map
    initialBlock: 50505403
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xd91e80cf2e7be2e162c6513ced06f1dd0da35296"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.neg_risk_adapter.v1.MarketEvents
    doc: |
      Extracts market/question lifecycle events (MarketPrepared,
      QuestionPrepared, OutcomeReported) from the NegRiskAdapter contract.

  - name: map_trading_events
    kind: map
    initialBlock: 50505403
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xd91e80cf2e7be2e162c6513ced06f1dd0da35296"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.neg_risk_adapter.v1.TradingEvents
    doc: |
      Extracts position and redemption events (PositionSplit, PositionsMerge,
      PositionsConverted, PayoutRedemption) from the NegRiskAdapter contract.

  - name: map_admin_events
    kind: map
    initialBlock: 50505403
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xd91e80cf2e7be2e162c6513ced06f1dd0da35296"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.neg_risk_adapter.v1.AdminEvents
    doc: |
      Extracts admin role events (NewAdmin, RemovedAdmin) from the
      NegRiskAdapter contract.

  - name: map_all_events
    kind: map
    initialBlock: 50505403
    blockFilter:
      module: eth_common:index_events
      query:
        string: "evt_addr:0xd91e80cf2e7be2e162c6513ced06f1dd0da35296"
    inputs:
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:polymarket.neg_risk_adapter.v1.AllEvents
    doc: |
      Extracts all NegRiskAdapter events (market lifecycle, trading,
      admin) from a single pass over the NegRiskAdapter contract.
