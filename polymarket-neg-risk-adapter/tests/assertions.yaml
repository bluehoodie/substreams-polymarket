# `substreams run --test-file` assertions on block 96600000, the same block as the
# Rust fixture testdata/polygon_96600000.binpb.b64. Run: scripts/run_test_files.sh.
# Paths must yield a string (hence `| tostring`): the CLI runner skips other results.
tests:
  - module: map_all_events
    block: 96600000
    path: '.tradingEvents.positionSplit | length | tostring'
    expect: "3"
  - module: map_all_events
    block: 96600000
    path: '.tradingEvents.payoutRedemption | length | tostring'
    expect: "1"
  - module: map_all_events
    block: 96600000
    path: '.tradingEvents.payoutRedemption[0].payout'
    expect: "8378379"
