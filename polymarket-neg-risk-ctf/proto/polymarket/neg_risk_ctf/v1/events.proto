syntax = "proto3";

package polymarket.neg_risk_ctf.v1;

// TransactionContext contains metadata about the transaction and log entry
message TransactionContext {
  string tx_hash = 1;
  uint64 log_index = 2;
  uint64 block_number = 3;
  uint64 timestamp = 4;
}

// FeeCharged - emitted when protocol fees are collected
message FeeCharged {
  string recipient = 1;
  string token_id = 2;
  string amount = 3;
  TransactionContext tx = 4;
}

// NewAdmin - emitted when a new admin is added
message NewAdmin {
  string new_admin_address = 1;
  string admin = 2;
  TransactionContext tx = 3;
}

// NewOperator - emitted when a new operator is added
message NewOperator {
  string new_operator_address = 1;
  string admin = 2;
  TransactionContext tx = 3;
}

// RemovedAdmin - emitted when an admin is removed
message RemovedAdmin {
  string removed_admin = 1;
  string admin = 2;
  TransactionContext tx = 3;
}

// RemovedOperator - emitted when an operator is removed
message RemovedOperator {
  string removed_operator = 1;
  string admin = 2;
  TransactionContext tx = 3;
}

// OrderCancelled - emitted when an order is cancelled
message OrderCancelled {
  bytes order_hash = 1;
  TransactionContext tx = 2;
}

// OrderFilled - emitted when an order is filled (main trading event)
message OrderFilled {
  bytes order_hash = 1;
  string maker = 2;
  string taker = 3;
  string maker_asset_id = 4;
  string taker_asset_id = 5;
  string maker_amount_filled = 6;
  string taker_amount_filled = 7;
  string fee = 8;
  TransactionContext tx = 9;
}

// OrdersMatched - emitted when a taker order is matched against maker orders
message OrdersMatched {
  bytes taker_order_hash = 1;
  string taker_order_maker = 2;
  string maker_asset_id = 3;
  string taker_asset_id = 4;
  string maker_amount_filled = 5;
  string taker_amount_filled = 6;
  TransactionContext tx = 7;
}

// TokenRegistered - emitted when a token pair is registered for trading
message TokenRegistered {
  string token0 = 1;
  string token1 = 2;
  bytes condition_id = 3;
  TransactionContext tx = 4;
}

// TradingPaused - emitted when trading is paused
message TradingPaused {
  string pauser = 1;
  TransactionContext tx = 2;
}

// TradingUnpaused - emitted when trading is unpaused
message TradingUnpaused {
  string pauser = 1;
  TransactionContext tx = 2;
}

// ProxyFactoryUpdated - emitted when proxy factory is updated
message ProxyFactoryUpdated {
  string old_proxy_factory = 1;
  string new_proxy_factory = 2;
  TransactionContext tx = 3;
}

// SafeFactoryUpdated - emitted when safe factory is updated
message SafeFactoryUpdated {
  string old_safe_factory = 1;
  string new_safe_factory = 2;
  TransactionContext tx = 3;
}

// FeeEvents is a collection of all fee events
message FeeEvents {
  repeated FeeCharged fee_charged = 1;
}

// AdminEvents is a collection of all admin management events
message AdminEvents {
  repeated NewAdmin new_admin = 1;
  repeated NewOperator new_operator = 2;
  repeated RemovedAdmin removed_admin = 3;
  repeated RemovedOperator removed_operator = 4;
}

// TradingEvents is a collection of all trading events
message TradingEvents {
  repeated OrderCancelled order_cancelled = 1;
  repeated OrderFilled order_filled = 2;
  repeated OrdersMatched orders_matched = 3;
}

// RegistryEvents is a collection of all token registry events
message RegistryEvents {
  repeated TokenRegistered token_registered = 1;
}

// PauseEvents is a collection of all trading pause/unpause events
message PauseEvents {
  repeated TradingPaused trading_paused = 1;
  repeated TradingUnpaused trading_unpaused = 2;
}

// ConfigEvents is a collection of all configuration update events
message ConfigEvents {
  repeated ProxyFactoryUpdated proxy_factory_updated = 1;
  repeated SafeFactoryUpdated safe_factory_updated = 2;
}

// AllEvents combines all event types
message AllEvents {
  optional FeeEvents fee_events = 1;
  optional AdminEvents admin_events = 2;
  optional TradingEvents trading_events = 3;
  optional RegistryEvents registry_events = 4;
  optional PauseEvents pause_events = 5;
  optional ConfigEvents config_events = 6;
}
